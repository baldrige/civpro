project:
  type: book
  # Tidy the chapter titles in llms.txt (see scripts/clean-llms-txt.R).
  post-render: scripts/clean-llms-txt.R
  # Oral-argument clips, played by <audio> tags (see audio/cut.sh), and the
  # court filings linked from "Read the Complaint" boxes, and the scripts for
  # the "Try It" tools (tools/).
  resources:
    - audio/*.mp3
    - documents/*.pdf
    - tools/*.js

book:
  title: "Civil Procedure"
  author: "Thomas B. Bennett"
  chapters:
    - index.qmd
    - part: "From Claim to Judgment"
      chapters:
        - intro1.qmd
        - tradeoffs.qmd
        - what_is_procedure.qmd
        - pleadings.qmd
        - discovery.qmd
        - avoiding_trial.qmd
        - trial_appeal.qmd
        - judgments.qmd
        - aggregation.qmd
    - part: "Jurisdiction & Choice of Law"
      chapters:
        - intro2.qmd
        - personal_jurisdiction.qmd
        - subject_matter_jurisdiction.qmd
        - venue_transfer_fnc.qmd
        - erie_doctrine.qmd
    - part: "Supplement"
      chapters:
        - frcp.qmd
        - statutes.qmd
        - constitution.qmd
  site-url: https://civ.pro
  repo-url: https://github.com/baldrige/civpro
  repo-actions: [edit, issue]
  sidebar:
    logo: cover.jpg
    logo-alt: "Civil Procedure: home"
  page-footer:
    center: "© Thomas B. Bennett · [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
  downloads: [pdf]
  google-analytics: "G-M6E3TREXQZ"
  # Also publish a plain-Markdown copy of each page and an llms.txt index,
  # for readers who paste chapters into AI tools.
  llms-txt: true

format:

  pdf:
    cover-image: cover.jpg
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 1
    # Place figures exactly where they appear in the text (as on the website)
    # rather than letting LaTeX float them away from the surrounding text.
    fig-pos: H
    documentclass: scrbook
    papersize: letter
    geometry:
      - left = 1 in
      - right = 2.75 in
      - top = 1.5 in
      - bottom = 1.5 in
      - marginparsep = 5 mm
      - marginparwidth = 50 mm
      - heightrounded
    pagestyle: headings
    pdf-engine: xelatex
    # Free fonts bundled with TeX Live (tex-gyre), so the PDF builds anywhere.
    # Pagella is a Palatino clone; Adventor is a geometric sans in the spirit of Futura.
    mainfont: texgyrepagella
    mainfontoptions:
      - Extension = .otf
      - UprightFont = *-regular
      - BoldFont = *-bold
      - ItalicFont = *-italic
      - BoldItalicFont = *-bolditalic
    sansfont: texgyreadventor
    sansfontoptions:
      - Extension = .otf
      - UprightFont = *-regular
      - BoldFont = *-bold
      - ItalicFont = *-italic
      - BoldItalicFont = *-bolditalic
    fontsize: 10pt
    linestretch: 1.0
    keep-tex: true
    header-includes: |
          \titlehead{\includegraphics[width=4.5in]{cover.jpg}}
    include-in-header:
      - text: |
          \lineskiplimit = -\maxdimen
          \usepackage{setspace}
          % When a figure or a case heading moves to the next page, leave the
          % space at the bottom instead of stretching the text to fill it.
          \raggedbottom
          \makeatletter
          % With ragged bottoms a short page costs nothing, so LaTeX's bonus
          % for breaking before a heading (\@secpenalty = -300) would pull
          % headings to the next page, leaving their margin notes behind.
          \AtBeginDocument{\@secpenalty=\z@}
          % Start a new page if less than #1 is left (used by pdf-layout.lua
          % before case headings with portraits). \penalty\z@ updates
          % \pagetotal without favoring a break here.
          \newcommand\portraitspace[1]{\par\penalty\z@
            \ifdim\dimexpr\pagegoal-\pagetotal\relax<#1\relax\newpage\fi}
          \makeatother
          % Quarto puts margin content (portraits, citations, footnotes) in
          % \marginnote, which is fixed in place and runs off the bottom of the
          % page. Use \marginpar instead, which marginfix stacks without
          % overlaps and keeps within the page.
          \usepackage{marginfix}
          \AtBeginDocument{\renewcommand{\marginnote}[1]{\marginpar[{\raggedleft #1}]{\raggedright #1}}}
          % With \lineskiplimit = -\maxdimen, a figure placed in the text
          % (fig-pos: H) would overlap the line above it. Add no interline
          % glue before the figure box.
          \makeatletter
          \AtBeginDocument{\renewcommand\float@endH{\@endfloatbox\vskip\intextsep
            \if@flstyle\setbox\@currbox\float@makebox\columnwidth\fi
            \nointerlineskip\box\@currbox\vskip\intextsep\relax}}
          % Inside figures, use normal line spacing so an image can't overlap
          % its caption; keep at least 6pt between them.
          \AtBeginDocument{\g@addto@macro\@floatboxreset{\lineskiplimit\z@ \lineskip 6pt\relax}}
          \makeatother
    filters:
      # pre-ast: before Quarto turns figure divs into its own float objects
      - path: pdf-layout.lua
        at: pre-ast

  html:
    theme:
      light: [flatly, theme.scss, theme-light.scss]
      dark: [darkly, theme.scss]
    lightbox:
      match: auto

fig-cap-location: top
number-depth: 2
lightbox: true


