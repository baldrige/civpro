name: Build and publish

# Every push to main rebuilds the HTML site and the PDF and deploys them to
# GitHub Pages. Pull requests are built (to catch errors) but not deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A healthy build takes about 5 minutes. Without a limit, a hung download
    # can hold the job (and the deploy queue) for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        timeout-minutes: 15
        with:
          version: 1.11.9
          tinytex: true

      # R renders the data figures (see data/README.md).
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::ggplot2

      - name: Render book (HTML + PDF)
        timeout-minutes: 20
        run: quarto render

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
